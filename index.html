<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shell Crafter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090c12;
    --bg2: #0d1117;
    --bg3: #111827;
    --panel: #141c2b;
    --panel2: #1a2540;
    --border: #1e2d45;
    --border2: #263552;
    --blue: #1e6fd9;
    --blue2: #2a8aff;
    --blue3: #4da3ff;
    --orange: #f07020;
    --orange2: #ff8c38;
    --orange3: #ffa55e;
    --text: #c8d8f0;
    --text2: #7a9cc0;
    --text3: #4a6888;
    --green: #3ddc97;
    --pipe: #9b5de5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orbs */
  body::after {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(30,111,217,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .orb2 {
    position: fixed;
    bottom: -150px; right: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(240,112,32,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(9,12,18,0.85);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--orange), var(--blue));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: -0.02em;
  }

  .logo-text span { color: var(--orange2); }

  .header-badge {
    font-size: 0.7rem;
    color: var(--text3);
    border: 1px solid var(--border2);
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Layout */
  .container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 20px;
  }

  /* Sidebar */
  .sidebar {
    position: sticky;
    top: 24px;
    height: fit-content;
  }

  .sidebar-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text3);
    margin-bottom: 10px;
    padding-left: 4px;
  }

  .cmd-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cmd-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.15s ease;
    text-align: left;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
  }

  .cmd-btn:hover {
    background: var(--panel2);
    border-color: var(--border2);
    color: var(--text);
  }

  .cmd-btn.active {
    background: rgba(30, 111, 217, 0.12);
    border-color: var(--blue);
    color: var(--blue3);
  }

  .cmd-btn .cmd-name {
    font-weight: 700;
    color: var(--orange2);
    min-width: 52px;
  }

  .cmd-btn.active .cmd-name { color: var(--blue3); }

  .cmd-btn .cmd-desc {
    font-size: 0.72rem;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Main panel */
  .main {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Command output */
  .terminal-box {
    background: #050810;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }

  .terminal-header {
    background: var(--panel);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }

  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }

  .terminal-title {
    margin-left: 8px;
    font-size: 0.72rem;
    color: var(--text3);
    letter-spacing: 0.05em;
  }

  .terminal-body {
    padding: 18px 20px;
    min-height: 72px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .prompt {
    color: var(--green);
    font-size: 0.95rem;
    font-weight: 500;
    white-space: nowrap;
  }

  .command-output {
    color: var(--text);
    font-size: 0.95rem;
    flex: 1;
    min-width: 200px;
    word-break: break-all;
    line-height: 1.6;
  }

  .command-output .cmd-part { color: var(--orange2); font-weight: 700; }
  .command-output .flag-part { color: var(--blue3); }
  .command-output .pipe-sym { color: var(--pipe); font-weight: 700; margin: 0 4px; }
  .command-output .arg-part { color: var(--green); }

  .copy-btn {
    margin-left: auto;
    background: var(--panel2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 6px 14px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .copy-btn:hover { border-color: var(--orange); color: var(--orange2); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); }

  /* Command card */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .card-cmd-name {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--orange2);
    letter-spacing: -0.02em;
  }

  .card-cmd-full {
    font-size: 0.8rem;
    color: var(--text3);
  }

  .card-man-link {
    margin-left: auto;
    font-size: 0.72rem;
    color: var(--text3);
    text-decoration: none;
    border: 1px solid var(--border2);
    padding: 4px 10px;
    border-radius: 6px;
    transition: all 0.15s;
  }

  .card-man-link:hover { color: var(--blue3); border-color: var(--blue); }

  /* Options grid */
  .options-section {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    margin-bottom: 12px;
  }

  .options-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .opt-btn {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 7px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
    max-width: 300px;
  }

  .opt-btn:hover {
    background: rgba(30,111,217,0.1);
    border-color: var(--blue);
    color: var(--text);
  }

  .opt-btn.selected {
    background: rgba(30,111,217,0.18);
    border-color: var(--blue2);
    color: var(--blue3);
  }

  .opt-flag {
    color: var(--orange3);
    font-weight: 700;
    white-space: nowrap;
  }

  .opt-btn.selected .opt-flag { color: var(--blue3); }

  .opt-desc {
    font-size: 0.7rem;
    color: var(--text3);
    line-height: 1.3;
  }

  /* Argument input */
  .arg-section {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .arg-label {
    font-size: 0.7rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .arg-input {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 7px 12px;
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    flex: 1;
    outline: none;
    transition: border-color 0.15s;
  }

  .arg-input:focus { border-color: var(--blue); }
  .arg-input::placeholder { color: var(--text3); }

  /* Pipe section */
  .pipe-section {
    padding: 16px 20px;
  }

  .pipe-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 12px;
  }

  .pipe-btn {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 7px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text2);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pipe-btn:hover {
    background: rgba(155,93,229,0.1);
    border-color: var(--pipe);
    color: #c89dff;
  }

  .pipe-btn.active {
    background: rgba(155,93,229,0.18);
    border-color: var(--pipe);
    color: #c89dff;
  }

  .pipe-sym-icon { color: var(--pipe); font-weight: 700; }

  .pipe-arg-input {
    background: var(--bg3);
    border: 1px solid rgba(155,93,229,0.3);
    border-radius: 6px;
    padding: 7px 12px;
    color: #c89dff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    width: 180px;
    outline: none;
    margin-top: 10px;
    transition: border-color 0.15s;
  }

  .pipe-arg-input:focus { border-color: var(--pipe); }
  .pipe-arg-input::placeholder { color: var(--text3); }

  .pipe-chain {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
    align-items: center;
  }

  .pipe-tag {
    background: rgba(155,93,229,0.14);
    border: 1px solid rgba(155,93,229,0.35);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.78rem;
    color: #c89dff;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pipe-tag-remove {
    cursor: pointer;
    color: var(--text3);
    font-size: 0.9rem;
    line-height: 1;
    transition: color 0.1s;
  }

  .pipe-tag-remove:hover { color: #ff5f57; }

  /* Clear / reset */
  .clear-btn {
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 6px 14px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 8px;
  }

  .clear-btn:hover { border-color: #ff5f57; color: #ff5f57; }

  /* Footer */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    font-size: 0.7rem;
    color: var(--text3);
    border-top: 1px solid var(--border);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--blue); }

  /* Animations */
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card { animation: fadeSlide 0.2s ease; }

  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .cmd-list { flex-direction: row; flex-wrap: wrap; }
    .cmd-btn { flex: 1; min-width: 120px; }
  }

  /* Shell Crafter refresh: calmer UI, light/dark themes, pipeline workflow */
  :root {
    color-scheme: light;
    --bg:#f6f7f9; --bg2:#eef1f5; --bg3:#e6eaf0; --panel:#fff; --panel2:#f2f4f7;
    --border:#d8dee8; --border2:#bfc8d5; --blue:#2563eb; --blue2:#2563eb; --blue3:#174dbd;
    --orange:#a16207; --orange2:#174dbd; --orange3:#174dbd; --text:#18202b; --text2:#5f6d7d;
    --text3:#7d8898; --green:#0f8a5f; --pipe:#7c3aed; --shadow:0 18px 55px rgba(20,31,46,.10);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg:#111317; --bg2:#15181d; --bg3:#20242b; --panel:#181b20; --panel2:#20242b;
    --border:#2d333d; --border2:#3b4350; --blue:#78a6ff; --blue2:#8fb6ff; --blue3:#b8ceff;
    --orange:#e0b95b; --orange2:#b8ceff; --orange3:#b8ceff; --text:#eef2f7; --text2:#a2acba;
    --text3:#778293; --green:#56d39b; --pipe:#c6a7ff; --shadow:0 20px 60px rgba(0,0,0,.28);
  }
  body { background:var(--bg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.45; }
  body::before, body::after, .orb2 { display:none; }
  header { position:sticky; top:0; padding:14px 24px; background:color-mix(in srgb,var(--panel) 90%,transparent); border-bottom-color:var(--border); box-shadow:none; }
  .logo::before { content:"$"; width:34px; height:34px; border-radius:8px; display:grid; place-items:center; background:var(--text); color:var(--bg); font-family:"SFMono-Regular",Consolas,monospace; font-weight:800; }
  .logo-icon{display:none;} .logo-text { font-family:inherit; font-size:1rem; letter-spacing:0; } .logo-text span { color:inherit; }
  .header-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .theme-btn { background:transparent; border:1px solid var(--border2); color:var(--text2); border-radius:7px; min-height:36px; padding:0 12px; cursor:pointer; }
  .theme-btn:hover { border-color:var(--blue); color:var(--blue3); }
  .header-badge { border-radius:7px; }
  .container { max-width:1360px; grid-template-columns:290px minmax(0,1fr); }
  .sidebar { top:76px; } .sidebar-label,.section-label { color:var(--text3); font-weight:750; }
  .cmd-search { width:100%; min-height:38px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); color:var(--text); outline:none; padding:0 11px; margin-bottom:10px; }
  .cmd-search:focus { border-color:var(--blue); background:var(--panel); }
  .pipe-hint { display:none; border:1px solid var(--blue); background:color-mix(in srgb,var(--blue) 12%,var(--panel)); color:var(--blue3); border-radius:7px; padding:9px 10px; font-size:.82rem; margin-bottom:10px; }
  .pipe-hint.show { display:block; }
  .cmd-list { gap:6px; max-height:calc(100vh - 190px); overflow:auto; padding-right:2px; }
  .cmd-btn { background:transparent; border-color:transparent; color:var(--text2); display:grid; grid-template-columns:64px minmax(0,1fr); width:100%; }
  .cmd-btn:hover { background:var(--panel2); border-color:transparent; } .cmd-btn.active { background:color-mix(in srgb,var(--blue) 12%,var(--panel)); border-color:var(--blue); color:var(--blue3); }
  .cmd-btn .cmd-name, .cmd-btn.active .cmd-name { color:var(--blue3); }
  .terminal-box,.card,.explain-box,.pipeline-strip { background:var(--panel); border-color:var(--border); border-radius:8px; box-shadow:var(--shadow); }
  .terminal-box { background:#10141b; overflow:hidden; } html[data-theme="dark"] .terminal-box { background:#0a0d12; }
  .terminal-header { background:transparent; border-bottom-color:rgba(255,255,255,.08); } .terminal-title,.dot { opacity:.75; }
  .terminal-body { min-height:104px; align-items:flex-start; } .command-output { color:#eef2f7; font-family:"SFMono-Regular",Consolas,monospace; font-size:clamp(.9rem,1.6vw,1rem); }
  .copy-btn,.clear-btn,.add-pipe-btn { border-radius:7px; min-height:36px; background:var(--panel); color:var(--text2); border:1px solid var(--border2); padding:0 12px; }
  .copy-btn:hover,.add-pipe-btn:hover { border-color:var(--blue); color:var(--blue3); } .clear-btn:hover { border-color:#c2410c; color:#c2410c; }
  .explain-box { padding:16px 18px; box-shadow:none; } .explain-text { margin-top:8px; color:var(--text); font-size:.95rem; }
  .explain-list { margin:12px 0 0; padding:0; list-style:none; display:grid; gap:8px; }
  .explain-list li { border-left:3px solid var(--blue); padding-left:10px; color:var(--text2); font-size:.9rem; }
  .pipeline-strip { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 14px; box-shadow:none; }
  .stage-chip { min-height:34px; border-radius:7px; border:1px solid var(--border); background:var(--panel2); padding:0 10px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  .stage-chip.active { border-color:var(--blue); background:color-mix(in srgb,var(--blue) 12%,var(--panel)); color:var(--blue3); }
  .stage-index { color:var(--text3); font-size:.75rem; } .stage-remove { border:0; background:transparent; color:var(--text3); cursor:pointer; padding:0 1px; font-size:1rem; line-height:1; }
  .stage-remove:hover { color:#c2410c; } .add-pipe-btn.active { border-color:var(--pipe); color:var(--pipe); }
  .card-header,.options-section,.arg-section,.pipe-section { border-color:var(--border); } .card-cmd-name { font-family:"SFMono-Regular",Consolas,monospace; color:var(--blue3); }
  .opt-btn,.arg-input { background:var(--panel2); border-color:var(--border); color:var(--text2); }
  .opt-btn:hover,.opt-btn.selected,.arg-input:focus { border-color:var(--blue); background:var(--panel); color:var(--text); }
  .opt-flag,.opt-btn.selected .opt-flag { color:var(--blue3); } .card-man-link { border-radius:7px; } footer { border-top-color:var(--border); }
  @media (max-width:620px) { header,.terminal-body,.card-header,.arg-section { align-items:stretch; flex-direction:column; } .header-actions { justify-content:flex-start; } .copy-btn,.clear-btn,.theme-btn,.add-pipe-btn { flex:1; } }

  /* Final polish */
  .cmd-btn, .opt-btn, .copy-btn, .clear-btn, .add-pipe-btn, .theme-btn, .card-man-link, .arg-input { font-family: inherit; }
  .cmd-btn { grid-template-columns: 78px minmax(0,1fr); }
  .cmd-desc, .opt-desc { font-family: inherit; letter-spacing: 0; }
  .header-badge { letter-spacing: .04em; }
  .opt-btn { align-items: center; }
  .opt-desc { line-height: 1.25; }

  /* Token explanations */
  .command-output .cmd-part { color:#f8c471; }
  .command-output .flag-part { color:#93c5fd; }
  .command-output .arg-part { color:#5eead4; }
  .command-output .pipe-sym { color:#d8b4fe; }
  .term-token {
    border-radius:5px;
    padding:2px 3px;
    margin:0 1px;
    cursor:help;
    transition:background 120ms ease, box-shadow 120ms ease;
  }
  .term-token:hover, .term-token:focus-visible {
    background:rgba(255,255,255,.10);
    box-shadow:0 0 0 1px rgba(255,255,255,.16);
    outline:0;
  }
  .explain-text { max-width:72ch; line-height:1.45; }
  .explain-list { gap:7px; }
  .explain-list li {
    border-left:0;
    padding:8px 10px;
    border-radius:7px;
    background:var(--panel2);
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .explain-kind {
    min-width:70px;
    color:var(--text3);
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .explain-code {
    color:var(--blue3);
    font-family:"SFMono-Regular",Consolas,monospace;
    font-weight:800;
  }
  .explain-quote { color:var(--text2); }
  .explain-list li.flag .explain-code { color:#2563eb; }
  .explain-list li.arg .explain-code { color:#0f766e; }
  .explain-list li.pipe .explain-code { color:#7c3aed; }
  html[data-theme="dark"] .explain-list li.flag .explain-code { color:#93c5fd; }

// Command registry. A future man-page importer can call ShellCrafter.registerCommand({...}).
const commandRegistry = new Map();
COMMANDS.forEach(command => commandRegistry.set(command.name, command));

let state = {
  activeStage: 0,
  appendNext: false,
  query: '',
  stages: []
};

function registerCommand(command) {
  const normalized = {
    name: command.name,
    full: command.full || 'custom command',
    flags: Array.isArray(command.flags) ? command.flags : [],
    arg: command.arg || { placeholder: '', label: 'ARGS' },
    sourceUrl: command.sourceUrl || ''
  };
  commandRegistry.set(normalized.name, normalized);
  renderAll();
  return normalized;
}

function getCommands() {
  return [...commandRegistry.values()].sort((a, b) => a.name.localeCompare(b.name));
}

function getCommand(name) {
  return commandRegistry.get(name);
}

function createStage(commandName) {
  return { commandName, selectedFlags: [], arg: '' };
}

function getActiveStage() {
  return state.stages[state.activeStage] || null;
}

function selectCmd(name) {
  if (!state.stages.length) {
    state.stages.push(createStage(name));
    state.activeStage = 0;
  } else if (state.appendNext) {
    state.stages.push(createStage(name));
    state.activeStage = state.stages.length - 1;
    state.appendNext = false;
  } else {
    state.stages[state.activeStage] = createStage(name);
  }
  renderAll();
}

function toggleFlag(flag) {
  const stage = getActiveStage();
  if (!stage) return;
  stage.selectedFlags = stage.selectedFlags.includes(flag)
    ? stage.selectedFlags.filter(item => item !== flag)
    : [...stage.selectedFlags, flag];
  renderAll();
}

function setArg(value) {
  const stage = getActiveStage();
  if (!stage) return;
  stage.arg = value;
  updateOutput();
}

function startPipe() {
  state.appendNext = !state.appendNext;
  renderSidebar();
  renderPipeline();
}

function setActiveStage(index) {
  state.activeStage = index;
  state.appendNext = false;
  renderAll();
}

function removeStage(index) {
  if (state.stages.length <= 1) return;
  state.stages.splice(index, 1);
  state.activeStage = Math.max(0, Math.min(state.activeStage, state.stages.length - 1));
  state.appendNext = false;
  renderAll();
}

function renderSidebar() {
  const list = document.getElementById('cmdList');
  const hint = document.getElementById('pipeHint');
  const query = state.query.toLowerCase();
  const active = getActiveStage();
  const commands = getCommands().filter(c => `${c.name} ${c.full}`.toLowerCase().includes(query));
  if (hint) hint.classList.toggle('show', state.appendNext);
  list.innerHTML = commands.map(c => `
    <button class="cmd-btn ${active && active.commandName === c.name && !state.appendNext ? 'active' : ''}" onclick="selectCmd('${escAttr(c.name)}')">
      <span class="cmd-name">${esc(c.name)}</span>
      <span class="cmd-desc">${esc(c.full)}</span>
    </button>
  `).join('');
}

function renderPipeline() {
  const el = document.getElementById('pipelineStrip');
  if (!el) return;
  el.innerHTML = state.stages.map((stage, i) => `
    <button class="stage-chip ${i === state.activeStage && !state.appendNext ? 'active' : ''}" onclick="setActiveStage(${i})">
      <span class="stage-index">${i === 0 ? 'base' : 'pipe ' + i}</span>
      <strong>${esc(stage.commandName)}</strong>
      ${state.stages.length > 1 ? `<span class="stage-remove" onclick="event.stopPropagation(); removeStage(${i})">x</span>` : ''}
    </button>
  `).join('') + `<button class="add-pipe-btn ${state.appendNext ? 'active' : ''}" onclick="startPipe()">${state.appendNext ? 'Cancel pipe' : '+ Pipe'}</button>`;
}

function renderCard() {
  const stage = getActiveStage();
  const area = document.getElementById('cardArea');
  if (!stage) {
    area.innerHTML = '';
    return;
  }
  const c = getCommand(stage.commandName);
  const manHref = c.sourceUrl || `https://man7.org/linux/man-pages/man1/${c.name}.1.html`;
  area.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-cmd-name">${esc(c.name)}</div>
        <div class="card-cmd-full">${esc(c.full)}</div>
        <a class="card-man-link" href="${escAttr(manHref)}" target="_blank" rel="noopener">man page</a>
      </div>

      <div class="options-section">
        <div class="section-label">Options / flags</div>
        <div class="options-grid" id="optGrid">
          ${c.flags.map(f => `
            <button class="opt-btn ${stage.selectedFlags.includes(f.f) ? 'selected' : ''}" data-flag="${escAttr(f.f)}">
              <span class="opt-flag">${esc(f.f)}</span>
              <span class="opt-desc">${esc(f.d)}</span>
            </button>
          `).join('')}
        </div>
      </div>

      ${c.arg ? `
      <div class="arg-section">
        <span class="arg-label">${esc(c.arg.label)}</span>
        <input class="arg-input" id="argInput" placeholder="${escAttr(c.arg.placeholder)}"
          oninput="setArg(this.value)" value="${escAttr(stage.arg)}">
      </div>` : ''}

      <div class="pipe-section">
        <div class="section-label">Pipeline</div>
        <div class="pipe-controls">
          <button class="add-pipe-btn ${state.appendNext ? 'active' : ''}" onclick="startPipe()">${state.appendNext ? 'Cancel pipe' : '+ Add command after pipe'}</button>
        </div>
      </div>
    </div>
  `;
}

function getFlagMeta(command, flag) {
  return command.flags.find(item => item.f === flag) || { f: flag, d: 'use this option' };
}

function buildStageCommand(stage) {
  const parts = [stage.commandName, ...stage.selectedFlags];
  const arg = stage.arg.trim();
  if (arg) parts.push(arg);
  return parts.join(' ');
}

function buildCommand() {
  return state.stages.map(buildStageCommand).join(' | ');
}

function shortDesc(value) {
  return String(value || '')
    .replace(/\s*\([^)]*\)/g, '')
    .replace(/\s+/g, ' ')
    .replace(/\.$/, '')
    .trim();
}

function argDescription(command) {
  const label = (command.arg && command.arg.label ? command.arg.label : 'argument').toLowerCase();
  if (label === 'args' || label === 'extra args') return `extra arguments passed to ${command.name}`;
  if (label.includes('pattern + file')) return `input pattern and file for ${command.name}`;
  if (label.includes('file')) return `input file for ${command.name}`;
  if (label.includes('path')) return `path used by ${command.name}`;
  if (label.includes('url')) return `URL requested by ${command.name}`;
  if (label.includes('host')) return `remote host for ${command.name}`;
  return `${label} for ${command.name}`;
}

function explainRow(kind, code, description) {
  return `<li class="${escAttr(kind.toLowerCase())}"><span class="explain-kind">${esc(kind)}</span><span class="explain-code">${esc(code)}</span><span class="explain-quote">"${esc(shortDesc(description))}"</span></li>`;
}

function renderDefaultExplanation() {
  const text = document.getElementById('explainText');
  const list = document.getElementById('explainList');
  if (!text || !list) return;
  text.textContent = 'Hover any colored command, flag, argument, or pipe in the terminal for a focused explanation.';
  list.innerHTML = state.stages.map((stage, index) => {
    const command = getCommand(stage.commandName);
    const rows = [explainRow(index === 0 ? 'Command' : 'Pipe cmd', stage.commandName, command.full)];
    stage.selectedFlags.forEach(flag => {
      const meta = getFlagMeta(command, flag);
      rows.push(explainRow('Flag', meta.f, meta.d));
    });
    if (stage.arg.trim()) rows.push(explainRow('Arg', stage.arg.trim(), argDescription(command)));
    return rows.join('');
  }).join('') || explainRow('Command', 'none', 'select a command to begin');
}

function renderFocusedExplanation(detail) {
  const text = document.getElementById('explainText');
  const list = document.getElementById('explainList');
  if (!text || !list || !detail) return;
  text.textContent = detail.title;
  list.innerHTML = explainRow(detail.kind, detail.code, detail.description);
}

function tokenDetail(stageIndex, kind, value) {
  const stage = state.stages[stageIndex];
  if (!stage) return null;
  const command = getCommand(stage.commandName);
  if (kind === 'command') {
    return { kind: 'Command', code: command.name, title: 'Command name', description: command.full };
  }
  if (kind === 'flag') {
    const meta = getFlagMeta(command, value);
    return { kind: 'Flag', code: meta.f, title: 'Selected flag', description: meta.d };
  }
  if (kind === 'arg') {
    return { kind: 'Arg', code: value, title: 'Argument value', description: argDescription(command) };
  }
  if (kind === 'pipe') {
    const nextStage = state.stages[stageIndex + 1];
    const nextCommand = nextStage ? getCommand(nextStage.commandName) : null;
    return { kind: 'Pipe', code: '|', title: 'Pipeline connector', description: nextCommand ? `send output into ${nextCommand.name}` : 'send output into the next command' };
  }
  return null;
}

function updateExplanation() {
  renderDefaultExplanation();
}

function renderToken(kind, stageIndex, value, className) {
  return `<span class="term-token ${className}" tabindex="0" data-kind="${escAttr(kind)}" data-stage="${stageIndex}" data-value="${escAttr(value)}">${esc(value)}</span>`;
}

function updateOutput() {
  const raw = buildCommand();
  const out = document.getElementById('cmdOutput');
  if (!raw) {
    out.innerHTML = '<span style="color:var(--text3)">select a command to begin</span>';
    return;
  }
  out.innerHTML = state.stages.map((stage, index) => {
    const flagHtml = stage.selectedFlags.map(flag => ' ' + renderToken('flag', index, flag, 'flag-part')).join('');
    const arg = stage.arg.trim();
    const argHtml = arg ? ' ' + renderToken('arg', index, arg, 'arg-part') : '';
    const stageHtml = `${renderToken('command', index, stage.commandName, 'cmd-part')}${flagHtml}${argHtml}`;
    if (index === state.stages.length - 1) return stageHtml;
    return `${stageHtml} ${renderToken('pipe', index, '|', 'pipe-sym')}`;
  }).join(' ');
  updateExplanation();
}
function renderAll() {
  renderSidebar();
  renderPipeline();
  renderCard();
  updateOutput();
}

function copyCommand() {
  const raw = buildCommand();
  if (!raw) return;
  navigator.clipboard.writeText(raw).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1400);
  });
}

function clearAll() {
  state.stages = [createStage('ls')];
  state.activeStage = 0;
  state.appendNext = false;
  renderAll();
}
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('shell-crafter-theme', theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? 'Light' : 'Dark';
}

function esc(value) {
  return String(value).replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
}

function escAttr(value) {
  return esc(value).replace(/'/g, '&#39;');
}

const savedTheme = localStorage.getItem('shell-crafter-theme');
const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
applyTheme(savedTheme || preferredTheme);

document.getElementById('themeBtn')?.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});

document.getElementById('cmdSearch')?.addEventListener('input', event => {
  state.query = event.target.value;
  renderSidebar();
});

document.addEventListener('click', event => {
  const flagButton = event.target.closest('[data-flag]');
  if (flagButton) toggleFlag(flagButton.dataset.flag);
});


document.getElementById('cmdOutput')?.addEventListener('mouseover', event => {
  const token = event.target.closest('.term-token');
  if (!token) return;
  renderFocusedExplanation(tokenDetail(Number(token.dataset.stage), token.dataset.kind, token.dataset.value));
});

document.getElementById('cmdOutput')?.addEventListener('focusin', event => {
  const token = event.target.closest('.term-token');
  if (!token) return;
  renderFocusedExplanation(tokenDetail(Number(token.dataset.stage), token.dataset.kind, token.dataset.value));
});

document.getElementById('cmdOutput')?.addEventListener('mouseout', event => {
  const fromToken = event.target.closest('.term-token');
  const toToken = event.relatedTarget && event.relatedTarget.closest ? event.relatedTarget.closest('.term-token') : null;
  if (fromToken && !toToken) updateExplanation();
});

document.getElementById('cmdOutput')?.addEventListener('focusout', updateExplanation);
state.stages = [createStage('ls')];
renderAll();

window.ShellCrafter = { registerCommand, getCommands, buildCommand };
</script>
</body>
</html>
